<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBEX — Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F0B23; color: #E2E8F0; }
        .font-serif { font-family: 'Instrument Serif', serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #312A5F; border-radius: 10px; }
    </style>
</head>
<body x-data="adminPanel()">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar: Conversation Inbox -->
        <div class="w-96 bg-[#1B133C] border-r border-white/10 flex flex-col">
            <div class="p-6 border-b border-white/10">
                <h1 class="font-serif text-3xl text-white">Webex Admin</h1>
                <p class="text-xs text-white/50 mt-1 uppercase tracking-widest">Conversation Management</p>
            </div>

            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
                <template x-for="conv in conversations" :key="conv.id">
                    <div @click="selectConversation(conv)"
                         :class="selectedConvId === conv.id ? 'bg-white/10 border-white/20' : 'bg-transparent border-transparent hover:bg-white/5'"
                         class="p-4 rounded-2xl border cursor-pointer transition-all duration-200 group">
                        <div class="flex justify-between items-start mb-1">
                            <span class="font-semibold text-white" x-text="conv.user?.fullName || conv.user?.email"></span>
                            <span class="text-[10px] text-white/40" x-text="formatDate(conv.updatedAt)"></span>
                        </div>
                        <p class="text-sm text-white/60 truncate" x-text="conv.messages[0]?.content || 'No messages yet...'"></p>
                        <div class="mt-2 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full bg-green-500"></span>
                            <span class="text-[10px] uppercase tracking-tighter text-white/40">Active</span>
                        </div>
                    </div>
                </template>
                <div x-show="conversations.length === 0" class="text-center py-10 text-white/30 text-sm">
                    No active conversations found.
                </div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="flex-1 flex flex-col bg-[#0F0B23]">
            <template x-if="selectedConvId">
                <div class="flex flex-col h-full">
                    <!-- Chat Header -->
                    <div class="p-6 border-b border-white/10 flex justify-between items-center bg-[#1B133C]/30 backdrop-blur-md">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center font-bold text-white">
                                <span x-text="selectedUser?.fullName?.charAt(0) || 'U'"></span>
                            </div>
                            <div>
                                <h2 class="font-semibold text-white" x-text="selectedUser?.fullName || 'User'"></h2>
                                <p class="text-xs text-white/50" x-text="selectedUser?.email"></p>
                            </div>
                        </div>
                        <button @click="resolveConversation()" class="px-4 py-2 bg-white/10 hover:bg-white/20 text-white text-sm rounded-full transition-all">
                            Mark as Resolved
                        </button>
                    </div>

                    <!-- Messages List -->
                    <div id="chat-window" class="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar">
                        <template x-for="msg in messages" :key="msg.id">
                            <div :class="msg.senderId === adminId ? 'flex justify-end' : 'flex justify-start'">
                                <div :class="msg.senderId === adminId ? 'bg-[#1B133C] text-white rounded-tr-none' : 'bg-white/5 text-white/90 rounded-tl-none'"
                                     class="p-3 rounded-2xl max-w-[70%] shadow-sm">
                                    <p class="text-sm" x-text="msg.content"></p>
                                    <span class="text-[10px] opacity-40 block mt-1 text-right" x-text="formatTime(msg.createdAt)"></span>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Message Input -->
                    <div class="p-6 bg-[#1B133C]/20 border-t border-white/10">
                        <div class="flex gap-4 max-w-4xl mx-auto">
                            <input x-model="replyText" @keyup.enter="sendReply()"
                                   type="text" placeholder="Type your professional reply..."
                                   class="flex-1 bg-white/5 border border-white/10 rounded-2xl px-6 py-4 text-white outline-none focus:ring-2 ring-white/20 transition-all">
                            <button @click="sendReply()" class="px-6 py-4 bg-white text-[#1B133C] font-bold rounded-2xl hover:bg-opacity-90 transition-all active:scale-95">
                                Send
                            </button>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="!selectedConvId">
                <div class="flex-1 flex flex-col items-center justify-center text-center p-6">
                    <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white/20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                        </svg>
                    </div>
                    <h2 class="font-serif text-3xl text-white mb-2">Welcome, Admin</h2>
                    <p class="text-white/40 max-w-xs">Select a conversation from the sidebar to start helping your clients.</p>
                </div>
            </template>
        </div>
    </div>

    <script>
        function adminPanel() {
            return {
                socket: null,
                adminId: 'ADMIN_USER', // In real app, this comes from JWT
                conversations: [],
                selectedConvId: null,
                selectedUser: null,
                messages: [],
                replyText: '',

                async init() {
                    this.socket = io('https://backend-production-b82f.up.railway.app');
                    await this.fetchConversations();

                    this.socket.on('admin_notification', (data) => {
                        this.notifyAdmin(data);
                        this.fetchConversations();
                    });
                },

                async fetchConversations() {
                    const res = await fetch('https://backend-production-b82f.up.railway.app/admin/conversations', {
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                    });
                    if (res.ok) this.conversations = await res.json();
                },

                async selectConversation(conv) {
                    this.selectedConvId = conv.id;
                    this.selectedUser = conv.user;
                    this.messages = [];

                    const res = await fetch(`https://backend-production-b82f.up.railway.app:3000/admin/conversations/${conv.id}/history`, {
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        this.messages = data.messages;
                    }

                    this.socket.emit('join_conversation', {
                        conversationId: conv.id,
                        userId: this.adminId
                    });
                },

                async sendReply() {
                    if (!this.replyText.trim()) return;

                    const content = this.replyText;
                    this.replyText = '';

                    this.socket.emit('admin_reply', {
                        conversationId: this.selectedConvId,
                        content: content,
                        adminId: this.adminId
                    }, (res) => {
                        if (res.status === 'sent') {
                            this.messages.push({
                                id: res.messageId,
                                content: content,
                                senderId: this.adminId,
                                createdAt: new Date()
                            });
                            this.scrollToBottom();
                        }
                    });
                },

                async resolveConversation() {
                    await fetch(`https://backend-production-b82f.up.railway.app/admin/conversations/${this.selectedConvId}/status`, {
                        method: 'PATCH',
                        headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                        body: JSON.stringify({ status: 'RESOLVED' })
                    });
                    this.selectedConvId = null;
                    this.fetchConversations();
                },

                notifyAdmin(data) {
                    if (Notification.permission === "granted") {
                        new Notification("🚨 Urgent Help Needed", { body: data.message });
                    } else {
                        alert(`🚨 URGENT: User ${data.userId} needs help: ${data.message}`);
                    }
                },

                scrollToBottom() {
                    setTimeout(() => {
                        const win = document.getElementById('chat-window');
                        if (win) win.scrollTop = win.scrollHeight;
                    }, 100);
                },

                formatDate(d) {
                    return new Date(d).toLocaleDateString();
                },

                formatTime(d) {
                    return new Date(d).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                }
            }
        }

        window.onload = () => {
            if (Notification.permission !== "granted") {
                Notification.requestPermission();
            }
        };
    </script>
</body>
</html>
